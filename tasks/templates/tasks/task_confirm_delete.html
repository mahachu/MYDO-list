{% extends "tasks/base.html" %}

{% block title %}
Suppression de la tâche - MYDO list
{% endblock %}

{% block content %}

    <div class="delete-page">

        <div class="detail-card delete-card">

            <div class="delete-icon">
                <ion-icon name="trash-sharp"></ion-icon>
            </div>

            <h1 class="detail-title">Supprimer cette tâche ?</h1>

            <p class="detail-text">
                « {{ task.title }} » sera définitivement supprimée. Cette action est irréversible.
            </p>

            <div class="delete-actions">
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn-delete-confirm">Supprimer</button>
                </form>

                <a href="{% url 'task_detail' task.id %}" class="btn-cancel">Annuler</a>
            </div>

        </div>

    </div>

{% endblock %}
