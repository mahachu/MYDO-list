{% extends "tasks/base.html" %}

{% block title%}
Suppression de la tâche - MYDO lis
{% endblock %}

{% block content %}
<h2>Supprimer une tâche</h2>
<p>Êtes-vous sûr de vouloir supprimer la tâche <strong>{{ task.title }}</strong> ?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Supprimer</button>
</form>
<a href="{% url 'task_detail' task.id %}">Annuler</a>
{% endblock %}
